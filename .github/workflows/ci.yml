name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # buf breaking compares with an earlier commit
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: make build
      - run: make vet
      - run: make gamevet
      - run: make test
      - run: make web
      - run: make vuln
      - run: make buflint
      - run: make bufbreaking
        env:
          BUF_AGAINST: .git#ref=${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Check generated code is up to date
        run: |
          make gen
          git diff --exit-code
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make integration