version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # frames.proto's Go code is public (wire/), so the Go SDK can share it; recording.proto and snapshot.proto are only
  # ever stored, and stay internal (internal/wire). Same proto package, different Go packages, on purpose.
  ignore_only:
    PACKAGE_SAME_GO_PACKAGE:
      - proto/playhold/v1/frames.proto
      - proto/playhold/v1/recording.proto
      - proto/playhold/v1/snapshot.proto
breaking:
  use:
    - FILE
  # v0.5.0 renames ClientFrame.message, Error and Error.message, for Godot's protobuf generator. The bytes on the wire
  # don't change; only generated names do. Remove once the renames are the comparison's base.
  ignore_only:
    MESSAGE_NO_DELETE:
      - proto/playhold/v1/frames.proto
    FIELD_SAME_JSON_NAME:
      - proto/playhold/v1/frames.proto
    FIELD_SAME_NAME:
      - proto/playhold/v1/frames.proto
    FIELD_SAME_TYPE:
      - proto/playhold/v1/frames.proto