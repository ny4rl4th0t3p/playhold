# Pins each container to its own CPU core, so they can't take time from each other during a measurement. Used on top of
# compose.yaml by t12.sh. The defaults suit a machine with 4 cores.
services:
  game:
    cpuset: "${GAME_CPUSET:-0}"
    # For measuring: GAME_GODEBUG=gctrace=1 logs every garbage collection, GAME_GOGC sets the game's GOGC (such as 400,
    # for rarer collections), and DEBUG_ADDR=:6060 turns on the profiling endpoints. Not GODEBUG or GOGC themselves,
    # which docker compose, a Go program too, would also pick up.
    environment:
      GODEBUG: "${GAME_GODEBUG:-}"
      GOGC: "${GAME_GOGC:-}"
    ports:
      - "127.0.0.1:6060:6060"

  postgres:
    cpuset: "${POSTGRES_CPUSET:-1}"

  bot:
    # Two cores, so the bot isn't what limits the run.
    cpuset: "${BOT_CPUSET:-2,3}"