# Run, play and measure the sample game on your own machine. There's no TLS or rate limiting yet, so don't expose it to
# the internet. See README.md.
name: playhold-cards

services:
  game:
    build:
      context: ../..
      dockerfile: examples/cards/Dockerfile
      target: server
    # One bot holds many connections from one address, so the usual per-address cap is raised.
    command:
      - -max-conns-per-ip
      - "4096"
      - -empty-room-timeout
      - ${EMPTY_ROOM_TIMEOUT:-5m}
      - -max-rooms
      - ${MAX_ROOMS:-0}
      - -database-url
      - ${DATABASE_URL-postgres://postgres:playhold@postgres:5432/postgres?sslmode=disable}
      - -turn-time
      - ${TURN_TIME:-1m}
      - -finished-room-time
      - ${FINISHED_ROOM_TIME:-1m}
      - -timers-after-restart
      - ${TIMERS_AFTER_RESTART:-pause}
      - -disconnect-grace
      - ${DISCONNECT_GRACE:-1m}
      - -turns-snapshot-version
      - ${TURNS_SNAPSHOT_VERSION:-1}
      - -debug-addr
      - ${DEBUG_ADDR:-}
      - -shutdown-timeout
      - ${SHUTDOWN_TIMEOUT:-8s}
    # Docker kills the process after this, so it has to be longer than the shutdown timeout.
    stop_grace_period: ${STOP_GRACE_PERIOD:-10s}
    ports:
      - "${BIND:-127.0.0.1}:8080:8080"
    # A small VPS. Change these to try other sizes.
    cpus: ${GAME_CPUS:-1}
    mem_limit: ${GAME_MEMORY:-1g}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: playhold
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      # Over TCP, because the image's first-run setup also answers on its local socket.
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    cpus: ${POSTGRES_CPUS:-1}
    mem_limit: ${POSTGRES_MEMORY:-1g}

  bot:
    profiles: ["load"]
    build:
      context: ../..
      dockerfile: examples/cards/Dockerfile
      target: bot
    command:
      - -url
      - ws://game:8080/ws
      - -games
      - ${GAMES:-100}
      - -think
      - ${THINK:-1s}
      - -rate
      - ${RATE:-0}
      - -warmup
      - ${WARMUP:-0s}
      - -duration
      - ${DURATION:-0s}
      - -idle
      - ${IDLE:-0}
    # At high load the bot opens connections faster than closed ones free their ports. These only affect this container.
    sysctls:
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.ip_local_port_range: "1024 65000"
    depends_on:
      - game

volumes:
  postgres: