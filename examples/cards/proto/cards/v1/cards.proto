syntax = "proto3";

package cards.v1;

option go_package = "github.com/ny4rl4th0t3p/playhold/examples/cards/pb;pb";

// SchemaVersion is the version of the game's messages and views, which the server and page are built with. Raise it
// when a change means older pages can't play.
enum SchemaVersion {
  SCHEMA_VERSION_UNSPECIFIED = 0;
  SCHEMA_VERSION_CURRENT = 1;
}

// HandsMessage lists the messages the hands module handles.
enum HandsMessage {
  HANDS_MESSAGE_UNSPECIFIED = 0;
  HANDS_MESSAGE_PLAY = 1;
  HANDS_MESSAGE_DRAW = 2;
  HANDS_MESSAGE_PASS = 3;
}

// Play puts a card from the player's hand on the discard pile.
message Play {
  string card = 1;
  // chosen_suit is the suit to continue with, when the card is an eight.
  string chosen_suit = 2;
}

// Draw takes a card from the draw pile.
message Draw {}

// Pass ends the turn, after drawing or when there's nothing to draw.
message Pass {}

// DeckView is what everyone sees of the piles.
message DeckView {
  string top = 1;
  string active_suit = 2;
  uint32 draw_count = 3;
}

// TurnsView is what everyone sees of the game's progress.
message TurnsView {
  bool started = 1;
  string current = 2;
  string winner = 3;
  repeated string players = 4;
  // turn_millis_left and turn_millis_total let a client show a countdown. Left is measured when this view was made.
  int64 turn_millis_left = 5;
  int64 turn_millis_total = 6;
}

// OtherHand is what a player sees of someone else's hand.
message OtherHand {
  string player = 1;
  uint32 count = 2;
}

// DeckState is everything the deck module saves, including the order of the draw pile.
message DeckState {
  repeated string pile = 1;
  repeated string discard = 2;
  string active_suit = 3;
}

// TurnsState is everything the turns module saves.
message TurnsState {
  repeated string players = 1;
  uint32 current = 2;
  string winner = 3;
  uint64 turn_timer = 4;
}

// TurnExpired is the event when a player runs out of time.
message TurnExpired {
  string player = 1;
}

// FinishedGameExpired is the event when a finished game's room has been open long enough to see the result.
message FinishedGameExpired {}

// Cards is a list of cards.
message Cards {
  repeated string cards = 1;
}

// HandsState is everything the hands module saves, including every player's cards.
message HandsState {
  map<string, Cards> hands = 1;
  bool drew = 2;
}

// HandsView is what one player sees of the hands: their own cards, and only the size of the others.
message HandsView {
  repeated string cards = 1;
  repeated string playable = 2;
  bool can_draw = 3;
  bool can_pass = 4;
  repeated OtherHand others = 5;
}