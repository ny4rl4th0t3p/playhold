<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crazy Eights</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, sans-serif;
        }

        body {
            margin: 0 auto;
            max-width: 40rem;
            padding: 1rem;
        }

        h1 {
            margin-top: 0;
        }

        button {
            font: inherit;
            padding: 0.5rem 0.75rem;
        }

        input {
            font: inherit;
            padding: 0.5rem;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.75rem 0;
        }

        .card {
            font-size: 1.25rem;
            min-width: 3.5rem;
            min-height: 4.5rem;
        }

        .card {
            color: CanvasText;
        }

        .card.red {
            color: light-dark(#c62828, #ef5350);
        }

        .card:disabled {
            opacity: 0.45;
        }

        #top {
            cursor: default;
            opacity: 1;
        }

        .timer {
            background: light-dark(#e0e0e0, #424242);
            border-radius: 0.25rem;
            height: 1.5rem;
            overflow: hidden;
            position: relative;
        }

        .timer-fill {
            height: 100%;
        }

        .timer-text {
            font-variant-numeric: tabular-nums;
            left: 0;
            line-height: 1.5rem;
            position: absolute;
            right: 0;
            text-align: center;
            top: 0;
        }

        #message {
            color: #c62828;
            min-height: 1.5rem;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
<h1>Crazy Eights</h1>
<p id="status"></p>
<p id="message" role="alert"></p>
<button id="reclaim" hidden>Play here instead</button>
<button id="reload" hidden>Reload</button>

<section id="lobby" class="row">
    <button id="new-game">New game</button>
    <button id="find-game">Play with someone</button>
    <button id="stop-looking" hidden>Stop looking</button>
    <form id="join-form" class="row">
        <input id="code" placeholder="Room code" maxlength="32" pattern="[A-Za-z0-9_\-]+" required aria-label="Room code">
        <button>Join</button>
    </form>
</section>

<section id="game" hidden>
    <p>Room code: <strong id="room"></strong></p>
    <p id="turn"></p>
    <p id="away" hidden>The other player has lost their connection. Their turns run out on the timer until they're back.</p>
    <div id="timer" class="timer" role="timer" hidden>
        <div id="timer-fill" class="timer-fill"></div>
        <span id="timer-text" class="timer-text"></span>
    </div>
    <div class="row">
        <button id="top" class="card" disabled></button>
        <p id="table"></p>
    </div>
    <h2>Your hand</h2>
    <div id="hand" class="row"></div>
    <div id="suits" class="row" hidden></div>
    <div class="row">
        <button id="draw">Draw</button>
        <button id="pass">Pass</button>
    </div>
</section>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
