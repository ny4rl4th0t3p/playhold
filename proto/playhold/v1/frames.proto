syntax = "proto3";

package playhold.v1;

option go_package = "github.com/ny4rl4th0t3p/playhold/internal/wire;wire";

// #region frames

// ClientFrame is everything a client can send.
message ClientFrame {
  // seq is chosen by the client and echoed in any error about this frame.
  uint64 seq = 1;
  oneof body {
    Hello hello = 2;
    Join join = 3;
    ModuleMessage message = 4;
    Queue queue = 5;
    LeaveQueue leave_queue = 6;
  }
}

// ServerFrame is everything a server can send.
message ServerFrame {
  oneof body {
    Welcome welcome = 1;
    RoomState state = 2;
    Error error = 3;
    RoomClosed closed = 4;
    Joined joined = 5;
    Queued queued = 6;
    Matched matched = 7;
  }
}

// Hello is the first frame on a connection. A returning guest sends the ID and secret from its Welcome; a new
// guest leaves them empty.
message Hello {
  uint32 protocol_version = 1;
  string player_id = 2;
  string secret = 3;
  // schema_versions says which version of each module's messages this client was built for.
  map<string, uint32> schema_versions = 4;
}

// Welcome accepts a Hello. The secret is only sent to a new guest, once.
message Welcome {
  string player_id = 1;
  string secret = 2;
}

// Join asks to enter the room with this code. An empty code creates a room, with a code the server makes. A code no room
// has creates one only on a server that allows codes clients choose; otherwise it's refused with ROOM_NOT_FOUND.
message Join {
  string code = 1;
}

// Joined accepts a Join. Module messages can be sent from now on. code is the room's, which the server made if the Join
// had none.
message Joined {
  uint64 seq = 1;
  string code = 2;
}

// Queue asks to be matched with other players. properties are what the player chose, such as a mode, for the game's
// matcher to read; the server limits how many there are and how long. The answer is Queued, or an Error.
message Queue {
  map<string, string> properties = 1;
}

// LeaveQueue stops waiting for a match. It has no answer.
message LeaveQueue {}

// Queued accepts a Queue: the player is waiting for a match. Matched follows once the game's matcher has found a group.
message Queued {
  uint64 seq = 1;
}

// Matched says the player has been matched: a new room with this code has a seat for them, kept for a while. Join it.
message Matched {
  string code = 1;
}

// ModuleMessage is a message for one module's handler. IDs are local to the module.
message ModuleMessage {
  string module = 1;
  uint32 id = 2;
  bytes payload = 3;
}

// ModuleView is what one module shows this player.
message ModuleView {
  string module = 1;
  bytes view = 2;
}

// RoomState is everything this player can see in the room.
message RoomState {
  repeated ModuleView views = 1;
}

// #endregion frames

// #region error-codes

// ErrorCode says what kind of problem an Error reports.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // ERROR_CODE_MALFORMED_FRAME means the frame could not be decoded or breaks a frame rule.
  ERROR_CODE_MALFORMED_FRAME = 1;
  // ERROR_CODE_UNKNOWN_MESSAGE means no module handles this message.
  ERROR_CODE_UNKNOWN_MESSAGE = 2;
  // ERROR_CODE_BAD_MESSAGE means the payload could not be decoded as the handler's message.
  ERROR_CODE_BAD_MESSAGE = 3;
  // ERROR_CODE_QUEUE_FULL means the room is busy. The message was not handled.
  ERROR_CODE_QUEUE_FULL = 4;
  // ERROR_CODE_ROOM_CLOSED means the room no longer accepts messages.
  ERROR_CODE_ROOM_CLOSED = 5;
  // ERROR_CODE_REJECTED means the handler refused the message.
  ERROR_CODE_REJECTED = 6;
  // ERROR_CODE_UNAUTHORIZED means the player ID and secret don't match. The client can say Hello again as a new guest.
  ERROR_CODE_UNAUTHORIZED = 7;
  // ERROR_CODE_ROOM_FULL means the room has no free seat.
  ERROR_CODE_ROOM_FULL = 8;
  // ERROR_CODE_UNSUPPORTED_PROTOCOL means the server doesn't speak this protocol version.
  ERROR_CODE_UNSUPPORTED_PROTOCOL = 9;
  // ERROR_CODE_UNAVAILABLE means the server can't do this right now, for example because its database is down. Try
  // again later.
  ERROR_CODE_UNAVAILABLE = 10;
  // ERROR_CODE_SERVER_FULL means the server won't create another room. Rooms that already exist can still be joined.
  ERROR_CODE_SERVER_FULL = 11;
  // ERROR_CODE_UPDATE_REQUIRED means this client is too old for this server. The player needs a newer client, such as
  // by reloading the page.
  ERROR_CODE_UPDATE_REQUIRED = 12;
  // ERROR_CODE_RATE_LIMITED means this client sent too much, too fast. The frame was not handled. Slow down and try
  // again later.
  ERROR_CODE_RATE_LIMITED = 13;
  // ERROR_CODE_TURNED_OFF means the server has turned this message off for a while, because it kept crashing the server
  // or hanging rooms. The message was not handled. Other messages still work.
  ERROR_CODE_TURNED_OFF = 14;
  // ERROR_CODE_ROOM_NOT_FOUND means no room has this code, and the server doesn't create rooms from codes clients choose.
  // A Join with an empty code creates a room instead.
  ERROR_CODE_ROOM_NOT_FOUND = 15;
}

// #endregion error-codes

// Error reports a problem with one client frame.
message Error {
  uint64 seq = 1;
  ErrorCode code = 2;
  string message = 3;
}

// #region close-reasons

// CloseReason says why a room closed.
enum CloseReason {
  CLOSE_REASON_UNSPECIFIED = 0;
  CLOSE_REASON_REQUESTED = 1;
  CLOSE_REASON_SHUTDOWN = 2;
  CLOSE_REASON_PANIC = 3;
  CLOSE_REASON_STUCK = 4;
  // CLOSE_REASON_INACTIVE means no player sent anything to the room for too long.
  CLOSE_REASON_INACTIVE = 5;
  // CLOSE_REASON_MATCH_INCOMPLETE means a player matched to the room didn't join it in time. Those who did can queue
  // again.
  CLOSE_REASON_MATCH_INCOMPLETE = 6;
}

// #endregion close-reasons

// RoomClosed says the room has closed.
message RoomClosed {
  CloseReason reason = 1;
}