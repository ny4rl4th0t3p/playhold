syntax = "proto3";

package playhold.v1;

option go_package = "github.com/ny4rl4th0t3p/playhold/internal/wire;wire";

// RoomSnapshot is everything needed to bring a room back. It's only ever stored, never sent to a client, because it
// holds hidden information and the seed's current state.
message RoomSnapshot {
  repeated string seats = 1;
  bytes rng_state = 2;
  int64 clock_unix_nanos = 3;
  repeated ModuleSnapshot modules = 4;
  repeated PendingTimer timers = 5;
  uint64 last_timer_id = 6;
  // away lists the seated players whose PlayerDisconnected has fired, so they get a PlayerReturned when they come back.
  repeated string away = 7;
}

// PendingTimer is a timer that hasn't fired. The event is a Protobuf message, stored by its full name.
message PendingTimer {
  uint64 id = 1;
  int64 due_unix_nanos = 2;
  string event_type = 3;
  bytes event = 4;
}

// ModuleSnapshot is one module's state, in that module's own message at that schema version.
message ModuleSnapshot {
  string module = 1;
  uint32 version = 2;
  bytes state = 3;
}